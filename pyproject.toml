[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacecalc"
version = "1.0.0"
description = "Pace, split, and finish-time calculator library and CLI for running and cycling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/nagamachia/pacecalc"

[project.scripts]
pacecalc = "pacecalc.cli:main"

[tool.setuptools]
packages = ["pacecalc"]
